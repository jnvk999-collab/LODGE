<style>
/* ===========================================================
   Sri Lakshmi Residency — stylesheet
   Mobile-first. Most guests will open this on a ₹8,000 Android
   phone over a 4G connection, so: no framework, no build step,
   system fonts as fallback, images lazy.
   =========================================================== */

/* ---------- palette: Midnight & Marigold ----------
   The look grand hotels actually use: deep midnight navy, real
   gold, and a warm ivory ground instead of cold white. Krishna
   is depicted in deep blue, so the navy carries the name too.

   Gold is the only bright colour that touches the whole page;
   emerald, ruby and peacock appear once each, as accents, so
   the page is colourful without turning into a rainbow. */
:root{
  --navy-950:#070d20; --navy-900:#0b1530; --navy-800:#132148;
  --navy-700:#1d2f68; --navy-600:#2b4390; --navy-50:#eef2fb;

  --gold-700:#8a6416; --gold-600:#b8862a; --gold-500:#d9a534;
  --gold-400:#f4bf4a; --gold-300:#ffd982; --gold-50:#fdf6e4;

  --emerald:#0f7b5f;  --emerald-50:#eafaf3;
  --ruby:#b31b3f;     --ruby-50:#fdeef2;
  --peacock:#0e7490;  --peacock-50:#e8f8fc;
  --plum:#6d28d9;     --plum-50:#f3eeff;

  --wa:#25d366; --wa-dk:#1da851;

  /* warm ivory ground, not cold white: it reads richer and makes
     the gold look like metal rather than yellow */
  --bg:#fdfbf6; --bg-alt:#f6f1e6; --bg-card:#ffffff;
  --ink:#141a2b; --ink-2:#4c5470; --ink-3:#7d849b;
  --line:#e7e1d3; --line-2:#d2cab6;

  --shadow:0 1px 2px rgba(11,21,48,.06), 0 8px 24px rgba(11,21,48,.08);
  --shadow-lg:0 2px 6px rgba(11,21,48,.10), 0 18px 48px rgba(11,21,48,.16);
  --shadow-gold:0 3px 16px rgba(217,165,52,.45);

  --r:14px; --r-lg:20px;
  --wrap:1120px;
  --sticky-h:64px;

  --fs:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fd:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --ft:'Noto Sans Telugu',var(--fs);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080c18; --bg-alt:#0d1428; --bg-card:#111a33;
    --ink:#f0ecdf; --ink-2:#aeb5c9; --ink-3:#848b9f;
    --line:#1e2745; --line-2:#2c3760;
    --navy-50:#141f42; --gold-50:#2a2008;
    --emerald-50:#08251c; --ruby-50:#2c0d17;
    --peacock-50:#08242c; --plum-50:#1c1140;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
    --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#080c18; --bg-alt:#0d1428; --bg-card:#111a33;
  --ink:#f0ecdf; --ink-2:#aeb5c9; --ink-3:#848b9f;
  --line:#1e2745; --line-2:#2c3760;
  --navy-50:#141f42; --gold-50:#2a2008;
  --emerald-50:#08251c; --ruby-50:#2c0d17;
  --peacock-50:#08242c; --plum-50:#1c1140;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--fs); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:var(--sticky-h);
  overflow-x:hidden;
}
body.te{font-family:var(--ft)}
img,svg,iframe{max-width:100%;display:block}
/* the display rule above would otherwise beat the browser's own
   [hidden]{display:none}, leaving hidden elements visible */
[hidden]{display:none!important}
h1,h2{
  /* Cormorant carries the "grand hotel" register that a geometric
     sans cannot. Used large and only for headings, never body. */
  font-family:var(--fd);font-weight:700;line-height:1.08;letter-spacing:-.015em;margin:0;
  text-wrap:balance;
}
h3{line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:800}
body.te h1, body.te h2{font-family:var(--ft);font-weight:600;line-height:1.28}
p{margin:0}
a{color:inherit}
table{border-collapse:collapse;width:100%}

.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:16px}
.skip{position:absolute;left:0;top:-120px;background:var(--navy-700);color:#fff;padding:12px 18px;z-index:200;border-radius:0 0 10px 0}
.skip:focus{top:0}
:focus-visible{outline:3px solid var(--amber-500);outline-offset:2px;border-radius:6px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:999px;border:1px solid transparent;
  font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn-lg{padding:14px 26px;font-size:16.5px}
.btn-block{width:100%}
.btn-call{background:var(--amber-500);color:#231400;box-shadow:0 2px 10px rgba(245,158,11,.35)}
.btn-call:hover{background:var(--amber-600);color:#fff}
.btn-wa{background:var(--wa);color:#04310f;box-shadow:0 3px 14px rgba(37,211,102,.4)}
.btn-wa:hover{background:var(--wa-dk);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{background:var(--navy-50);border-color:var(--gold-600);color:var(--navy-700)}

/* ---------- header ---------- */
.hdr{
  /* clears the notch / status bar on phones that report a safe-area inset */
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:100;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);
}
.hdr-in{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto;min-width:0}
.brand-mark{
  width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--navy-700),var(--navy-950));
  color:var(--gold-400);font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.04em;
  border:1px solid var(--gold-600);box-shadow:0 2px 10px rgba(11,21,48,.35);
}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt strong{font-family:var(--fd);font-size:21px;font-weight:700;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:none;gap:22px}
.nav a{text-decoration:none;font-size:14.5px;font-weight:600;color:var(--ink-2);padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--navy-700);border-color:var(--navy-600)}
.hdr-act{display:flex;align-items:center;gap:8px}
.lang{
  background:var(--bg-alt);border:1px solid var(--line);color:var(--ink-2);
  border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
.lang:hover{border-color:var(--navy-600);color:var(--navy-700)}
@media (min-width:900px){ .nav{display:flex} }
@media (max-width:420px){ .btn-call span{display:none} .btn-call{padding:11px 13px} }

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;padding:52px 0 58px;color:#fff;
  background:linear-gradient(165deg,var(--navy-950),var(--navy-800) 55%,var(--navy-700))}
.hero h1{text-shadow:0 2px 18px rgba(8,12,40,.45)}
/* gold hairline under the hero ties it to the price accents below */
.hero::before{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;z-index:1;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-300) 35%,var(--gold-400) 65%,var(--gold-600))}
.hero-bg{position:absolute;inset:0;z-index:-2}
.hero-bg img{width:100%;height:100%;object-fit:cover}
.hero::after{
  content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(165deg,rgba(7,13,32,.93) 0%,rgba(19,33,72,.90) 48%,rgba(29,47,104,.88) 100%);
}
.eyebrow{
  display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold-300);background:rgba(244,191,74,.10);border:1px solid rgba(244,191,74,.42);
  padding:5px 13px;border-radius:999px;margin-bottom:16px;
}
.hero h1{font-size:clamp(40px,10vw,74px);max-width:15ch;font-weight:700;letter-spacing:-.02em}
/* the price is the loudest thing on the page, in gold */
.hero h1 .amt{color:var(--gold-400);white-space:nowrap}
.hero-sub{margin-top:16px;font-size:clamp(16px,2.4vw,19px);color:#cdd6ee;max-width:46ch}
.hero-pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:22px 0 0}
.hero-pills li{
  background:rgba(255,255,255,.07);border:1px solid rgba(244,191,74,.28);
  padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;
}
.hero-cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:26px}
.hero-cta .btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.hero-cta .btn-ghost:hover{background:rgba(255,255,255,.14);border-color:#fff}
.hero-note{margin-top:17px;font-size:13.5px;color:#9aa5c6}

/* ---------- trust strip ---------- */
.trust{background:var(--navy-950);color:#fff;border-top:1px solid rgba(244,191,74,.2)}
.trust-in{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.16)}
.tr-item{background:transparent;padding:17px 14px;text-align:center}
.tr-item b{display:block;font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:0;color:var(--gold-400)}
.tr-item span{display:block;font-size:11px;color:#98a2c2;margin-top:4px;
  text-transform:uppercase;letter-spacing:.11em;font-weight:700}
@media (min-width:720px){ .trust-in{grid-template-columns:repeat(4,1fr)} }

/* ---------- sections ---------- */
.sec{padding:56px 0}
.sec-alt{background:var(--bg-alt)}
.sec-hd{max-width:60ch;margin-bottom:30px}
.sec-hd h2{font-size:clamp(32px,6vw,46px);position:relative;padding-bottom:14px}
.sec-hd h2::after{content:'';position:absolute;left:0;bottom:0;width:58px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-400))}
.sec-hd p{margin-top:10px;color:var(--ink-2);font-size:16px}

/* ---------- rooms ---------- */
.rooms{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:640px){ .rooms{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1000px){ .rooms{grid-template-columns:repeat(3,1fr)} }

/* One room category: the card becomes a wide feature panel instead of a
   lone card stranded in a three-column grid. */
.rooms.is-single{grid-template-columns:1fr;max-width:860px}
@media (min-width:760px){
  .rooms.is-single .room{flex-direction:row;align-items:stretch}
  .rooms.is-single .room-img{flex:0 0 42%;aspect-ratio:auto;min-height:320px}
  .rooms.is-single .room-bd{flex:1;padding:26px}
  .rooms.is-single .room-nm{font-size:24px}
  .rooms.is-single .room-pr b{font-size:34px}
}

/* Shown in place of a photo until real photographs exist. Deliberately
   quiet: it should read as "not yet", not as a broken image. */
.photo-pending{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-align:center;padding:30px 24px;
  background:linear-gradient(140deg,var(--navy-50),var(--gold-50));
  border-bottom:1px solid var(--line);
}
.photo-pending .pp-ic{font-size:34px;line-height:1;opacity:.6}
.photo-pending strong{font-family:var(--fd);font-size:22px;font-weight:700;color:var(--navy-800)}
.photo-pending .pp-sub{font-size:13.5px;color:var(--ink-2);max-width:34ch;line-height:1.55}
@media (min-width:760px){ .rooms.is-single .photo-pending{border-bottom:0;border-right:1px solid var(--line)} }

.room{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;
  transition:box-shadow .16s ease, transform .16s ease;
}
.room:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.room.is-popular{border-color:var(--amber-500);border-width:2px}
.room-tag{
  position:absolute;top:12px;left:12px;z-index:2;
  background:var(--amber-500);color:#231400;font-size:11.5px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:999px;
}
.room-img{aspect-ratio:4/3;background:var(--bg-alt)}
.room-img img{width:100%;height:100%;object-fit:cover}
.room-bd{padding:17px 17px 19px;display:flex;flex-direction:column;gap:11px;flex:1}
.room-nm{font-size:18.5px;font-weight:800}
.room-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-3)}
.room-ft{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.room-ft li{background:var(--navy-50);color:var(--navy-700);border-radius:7px;padding:4px 9px;font-size:12.5px;font-weight:600}
.room-ft li:nth-child(3n+2){background:var(--emerald-50);color:var(--emerald)}
.room-ft li:nth-child(3n+3){background:var(--plum-50);color:var(--plum)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .room-ft li{color:#5eead4}}
:root[data-theme="dark"] .room-ft li{color:#5eead4}
.room-note{font-size:13.5px;color:var(--ink-2);font-style:italic}
.room-ftr{margin-top:auto;padding-top:13px;border-top:1px dashed var(--line);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.room-pr b{font-family:var(--fd);font-size:40px;font-weight:700;letter-spacing:-.01em;color:var(--navy-800);line-height:1}
.room-pr span{font-size:13px;color:var(--ink-3);display:block}

/* ---------- long stay ---------- */
.longstay{margin-top:34px;background:var(--amber-50);border:1px solid var(--amber-500);
  border-radius:var(--r-lg);padding:24px}
.ls-hd h3{font-size:20px}
.ls-hd p{margin-top:7px;color:var(--ink-2);font-size:14.5px;max-width:64ch}
.ls-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
@media (min-width:640px){ .ls-grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1000px){ .ls-grid{grid-template-columns:repeat(4,1fr)} }
.ls{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.ls b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--gold-700)}
.ls strong{display:block;font-size:14px;font-weight:700;margin-top:3px}
.ls span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:5px}

/* ---------- amenities ---------- */
.amen{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;list-style:none;padding:0;margin:0}
@media (min-width:560px){ .amen{grid-template-columns:repeat(3,1fr)} }
@media (min-width:900px){ .amen{grid-template-columns:repeat(4,1fr)} }
.amen li{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 14px;display:flex;align-items:center;gap:11px;font-weight:600;font-size:14.5px;
}
.amen .ic{
  width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:var(--navy-50);font-size:19px;line-height:1;
}
/* each tile takes the next accent in the cycle, so the grid reads as
   colourful rather than as one block of blue */
.amen li:nth-child(6n+1) .ic{background:var(--peacock-50)} .amen li:nth-child(6n+1){border-color:var(--peacock)}
.amen li:nth-child(6n+2) .ic{background:var(--emerald-50)} .amen li:nth-child(6n+2){border-color:var(--emerald)}
.amen li:nth-child(6n+3) .ic{background:var(--ruby-50)} .amen li:nth-child(6n+3){border-color:var(--ruby)}
.amen li:nth-child(6n+4) .ic{background:var(--plum-50)} .amen li:nth-child(6n+4){border-color:var(--plum)}
.amen li:nth-child(6n+5) .ic{background:var(--gold-50)} .amen li:nth-child(6n+5){border-color:var(--gold-600)}
.amen li:nth-child(6n+6) .ic{background:var(--emerald-50)} .amen li:nth-child(6n+6){border-color:var(--emerald)}

/* ---------- location ---------- */
.loc{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:900px){ .loc{grid-template-columns:1fr 1fr;gap:32px;align-items:start} }
.dist{font-size:15px;margin-bottom:18px}
.dist th{
  text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding:0 10px 9px 0;border-bottom:2px solid var(--line-2);
}
.dist th:not(:first-child),.dist td:not(:first-child){text-align:right;padding-right:0}
.dist td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line)}
.dist td:first-child{font-weight:600}
.dist td:nth-child(2){font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy-600)}
.dist td:nth-child(3){font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:14px}
.loc-map iframe{width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-alt)}
.loc-map address{margin-top:14px;font-style:normal;color:var(--ink-2);font-size:15px;line-height:1.7}

/* ---------- offers ---------- */
.offers{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:700px){ .offers{grid-template-columns:repeat(2,1fr)} }
.offer{
  background:var(--bg-card);border:1px solid var(--line);border-top:5px solid var(--navy-600);
  border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow);
  transition:transform .14s ease, box-shadow .14s ease;
}
.offer:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.offer:nth-child(4n+1){border-top-color:var(--ruby)} .offer:nth-child(4n+1) h3{color:var(--ruby)}
.offer:nth-child(4n+2){border-top-color:var(--emerald)} .offer:nth-child(4n+2) h3{color:var(--emerald)}
.offer:nth-child(4n+3){border-top-color:var(--plum)} .offer:nth-child(4n+3) h3{color:var(--plum)}
.offer:nth-child(4n+4){border-top-color:var(--gold-600)} .offer:nth-child(4n+4) h3{color:var(--gold-600)}
.offer h3{font-size:18.5px}
.offer p{color:var(--ink-2);font-size:14.8px}
.offer .btn{align-self:flex-start;margin-top:auto}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:800px){ .gal{grid-template-columns:repeat(3,1fr)} }
.gal figure{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--bg-card)}
.gal img{aspect-ratio:4/3;object-fit:cover;width:100%}
.gal figcaption{padding:10px 13px;font-size:13.5px;font-weight:600;color:var(--ink-2)}

/* ---------- reviews ---------- */
.revs{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:800px){ .revs{grid-template-columns:repeat(3,1fr)} }
.rev{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.rev-st{color:var(--amber-500);font-size:15px;letter-spacing:2px}
.rev-tx{margin-top:10px;font-size:14.8px;color:var(--ink-2)}
.rev-by{margin-top:13px;font-size:13.5px;font-weight:700}
.rev-by span{font-weight:500;color:var(--ink-3)}
.rev-cta{margin-top:26px;padding:24px;background:linear-gradient(120deg,var(--gold-50),var(--bg-alt));border:2px dashed var(--gold-600);
  border-radius:var(--r);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.rev-cta p{font-weight:600;max-width:56ch}

/* ---------- booking ---------- */
/* Grid items default to min-width:auto, so a wide intrinsic element (a
   date input, a long unbroken word) can push the whole page sideways on a
   phone. min-width:0 lets them shrink to their column instead. */
.rooms>*,.ls-grid>*,.amen>*,.loc>*,.offers>*,.gal>*,.revs>*,.book>*,.fld-row>*,.ftr-in>*{min-width:0}
.fld input,.fld select,.fld textarea{min-width:0}

.book{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:920px){ .book{grid-template-columns:1.25fr .85fr;gap:32px;align-items:start} }
.bk-form{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:15px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fld label{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{
  font:inherit;font-size:16px; /* 16px stops iOS zooming on focus */
  padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;
  background:var(--bg);color:var(--ink);width:100%;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--navy-600);outline-offset:1px}
.fld textarea{resize:vertical;min-height:72px}
.fld input:invalid:not(:placeholder-shown){border-color:#dc2626}
.est{
  display:none;background:var(--navy-50);border:1px solid var(--navy-600);border-radius:10px;
  padding:13px 15px;font-size:14.5px;font-weight:600;
}
.est.on{display:block}
.est b{font-size:18px}
.bk-hint{font-size:13px;color:var(--ink-3);text-align:center}

.bk-side{display:flex;flex-direction:column;gap:16px}
.card-contact,.card-upi,.card-policy{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;
}
.bk-side h3{font-size:16px;margin-bottom:13px}
.row-link{display:flex;align-items:center;gap:12px;padding:10px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.row-link:last-child{border-bottom:0}
.row-link .ri{width:36px;height:36px;flex:none;border-radius:9px;background:var(--navy-50);display:grid;place-items:center;font-size:16px}
.row-link small{display:block;font-size:12px;color:var(--ink-3)}
.row-link strong{font-size:15px;font-weight:700}
.row-link:hover strong{color:var(--navy-700)}
.card-upi p{font-size:14px;color:var(--ink-2);margin-bottom:11px}
.upi-id{background:var(--bg-alt);border:1px dashed var(--line-2);border-radius:10px;padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px;font-weight:600;word-break:break-all;text-align:center}
.card-policy ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:8px}
.card-policy li{font-size:14px;color:var(--ink-2)}

/* ---------- footer ---------- */
.ftr{background:var(--navy-950);color:#aab3cc;padding:44px 0 34px;
  border-top:3px solid var(--gold-500)}
.ftr-in{display:grid;gap:24px}
@media (min-width:760px){ .ftr-in{grid-template-columns:1.4fr 1fr} }
.ftr-brand strong{color:var(--gold-300);font-family:var(--fd);font-size:28px;font-weight:700;
  display:block;margin-bottom:11px;letter-spacing:.01em}
.ftr-brand address{font-style:normal;font-size:14.5px;line-height:1.7;color:#c6cff2}
.ftr-reg{margin-top:11px;font-size:13px;color:var(--gold-400)}
.ftr-nav{display:flex;flex-direction:column;gap:9px}
.ftr-nav a{text-decoration:none;font-size:14.5px;color:#c6cff2}
.ftr-nav a:hover{color:#fff;text-decoration:underline}
.ftr-demo{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.16);padding-top:18px;
  font-size:12.5px;color:#9aa5d4;line-height:1.65}

/* ---------- sticky mobile bar ---------- */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:120;display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line);background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);
}
.sb{display:flex;align-items:center;justify-content:center;gap:8px;padding:17px 10px;
  text-decoration:none;font-weight:800;font-size:15.5px}
.sb span{font-size:17px}
.sb-call{background:var(--amber-500);color:#231400}
.sb-wa{background:var(--wa);color:#04310f}
@media (min-width:900px){ .sticky{display:none} body{padding-bottom:0} }

</style>
</head>
<body>

<!-- ============ HEADER ============ -->

<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="hero-bg"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20600%22%20width%3D%22800%22%20height%3D%22600%22%20role%3D%22img%22%20aria-label%3D%22Building%20Front%20placeholder%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23101a52%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%237c3aed%22%2F%3E%20%3C%2FlinearGradient%3E%20%3Cpattern%20id%3D%22p%22%20width%3D%2240%22%20height%3D%2240%22%20patternUnits%3D%22userSpaceOnUse%22%3E%20%3Cpath%20d%3D%22M0%2040L40%200M-10%2010L10%20-10M30%2050L50%2030%22%20stroke%3D%22rgba(255%2C255%2C255%2C.10)%22%20stroke-width%3D%222%22%2F%3E%20%3C%2Fpattern%3E%20%3C%2Fdefs%3E%20%3Crect%20width%3D%22800%22%20height%3D%22600%22%20fill%3D%22url(%23g)%22%2F%3E%20%3Crect%20width%3D%22800%22%20height%3D%22600%22%20fill%3D%22url(%23p)%22%2F%3E%20%3Cg%20transform%3D%22translate(400%20250)%22%20fill%3D%22none%22%20stroke%3D%22rgba(255%2C255%2C255%2C.85)%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%20%3Crect%20x%3D%22-70%22%20y%3D%22-52%22%20width%3D%22140%22%20height%3D%22104%22%20rx%3D%2210%22%2F%3E%20%3Ccircle%20cx%3D%22-30%22%20cy%3D%22-18%22%20r%3D%2215%22%2F%3E%20%3Cpath%20d%3D%22M-70%2034L-20%20-8l32%2026%2024-20%2034%2028%22%2F%3E%20%3C%2Fg%3E%20%3Ctext%20x%3D%22400%22%20y%3D%22392%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%2C-apple-system%2CSegoe%20UI%2CRoboto%2Csans-serif%22%20font-size%3D%2240%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3EBuilding%20Front%3C%2Ftext%3E%20%3Ctext%20x%3D%22400%22%20y%3D%22440%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%2C-apple-system%2CSegoe%20UI%2CRoboto%2Csans-serif%22%20font-size%3D%2223%22%20fill%3D%22rgba(255%2C255%2C255%2C.92)%22%3EReplace%20with%20a%20real%20photo%3C%2Ftext%3E%20%3Ctext%20x%3D%22400%22%20y%3D%22478%22%20text-anchor%3D%22middle%22%20font-family%3D%22system-ui%2C-apple-system%2CSegoe%20UI%2CRoboto%2Csans-serif%22%20font-size%3D%2219%22%20fill%3D%22rgba(255%2C255%2C255%2C.72)%22%3ELandscape%2C%20bright%20daylight%2C%201600%20%26%23215%3B%201200%20or%20larger%3C%2Ftext%3E%20%3C%2Fsvg%3E" alt="" width="800" height="600"></div>
  <div class="wrap hero-in">
    <p class="eyebrow" data-bind="heroEyebrow"></p>
    <h1 data-bind-html="heroTitle"></h1>
    <p class="hero-sub" data-bind="tagline"></p>

    <ul class="hero-pills" id="heroPills"></ul>

    <div class="hero-cta">
      <a class="btn btn-wa btn-lg" data-bind-href="waBook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6a12 12 0 0 1-4.6-4.1c-.3-.5-.8-1.4-.8-2.6 0-1.2.6-1.8.9-2.1.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2 0 .4 0 .5l-.4.5c-.1.2-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.8 1.2 2.1 1.3.2.1.4.1.6-.1l.7-.9c.2-.2.3-.2.6-.1l2 .9c.2.1.4.2.4.3.1.1.1.5-.1 1z"/></svg>
        <span data-bind="ctaWhatsApp"></span>
      </a>
      <a class="btn btn-ghost btn-lg" data-bind-href="tel"><span data-bind="ctaCall"></span></a>

    <p class="hero-note" data-bind="directNote"></p>

</section>

      <p data-bind="pRooms"></p>
    </header>
    <div class="rooms" id="roomsGrid"></div>

    <div class="longstay" id="longstay">
      <div class="ls-hd">

      </div>
      <div class="ls-grid" id="lsGrid"></div>

<section class="sec sec-alt" id="offers">

<!-- ============ BOOKING ============ -->
<section class="sec" id="contact">
  <div class="wrap">
    <header class="sec-hd">
      <h2 data-bind="h2Book"></h2>
      <p data-bind="pBook"></p>
    </header>

    <div class="book">
      <form class="bk-form" id="bookForm" novalidate>
        <div class="fld">
          <label for="bkName" data-bind="lblName"></label>
          <input id="bkName" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="fld">
          <label for="bkPhone" data-bind="lblPhone"></label>
          <input id="bkPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required>
        </div>
        <div class="fld-row">
          <div class="fld">
            <label for="bkIn" data-bind="lblIn"></label>
            <input id="bkIn" name="checkin" type="date" required>
          </div>
          <div class="fld">
            <label for="bkOut" data-bind="lblOut"></label>
            <input id="bkOut" name="checkout" type="date">
          </div>
        </div>
        <div class="fld-row">
          <div class="fld">
            <label for="bkRoom" data-bind="lblRoom"></label>
            <select id="bkRoom" name="room"></select>
          </div>
          <div class="fld">
            <label for="bkQty" data-bind="lblQty"></label>
            <select id="bkQty" name="qty"></select>
          </div>
        </div>
        <div class="fld">
          <label for="bkNote" data-bind="lblNote"></label>
          <textarea id="bkNote" name="note" rows="3"></textarea>
        </div>

        <output class="est" id="est" aria-live="polite"></output>

        <button class="btn btn-wa btn-lg btn-block" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6a12 12 0 0 1-4.6-4.1c-.3-.5-.8-1.4-.8-2.6 0-1.2.6-1.8.9-2.1.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2 0 .4 0 .5l-.4.5c-.1.2-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.8 1.2 2.1 1.3.2.1.4.1.6-.1l.7-.9c.2-.2.3-.2.6-.1l2 .9c.2.1.4.2.4.3.1.1.1.5-.1 1z"/></svg>
          <span data-bind="ctaSend"></span>
        </button>
        <p class="bk-hint" data-bind="bkHint"></p>
      </form>

      <aside class="bk-side">
        <div class="card-contact">
          <h3 data-bind="h3Reach"></h3>
          <a class="row-link" data-bind-href="tel">
            <span class="ri">&#128222;</span>
            <span><small data-bind="lblCall24"></small><strong data-bind="phone1"></strong></span>
          </a>
          <a class="row-link" data-bind-href="tel2">
            <span class="ri">&#128222;</span>
            <span><small data-bind="lblAlt"></small><strong data-bind="phone2"></strong></span>
          </a>
          <a class="row-link" data-bind-href="waPlain">
            <span class="ri">&#128172;</span>
            <span><small>WhatsApp</small><strong data-bind="phone1"></strong></span>
          </a>
          <a class="row-link" data-bind-href="mail">
            <span class="ri">&#9993;</span>
            <span><small data-bind="lblEmail"></small><strong data-bind="email"></strong></span>
          </a>
        </div>

        <div class="card-upi">

  var lang = 'en';
  function t(k) { return T[lang][k] != null ? T[lang][k] : T.en[k]; }
  function minPrice() { return Math.min.apply(null, C.rooms.map(function (r) { return r.price; })); }
  function inr0(n) { return Number(n).toLocaleString('en-IN'); }
  // the nightly figure, marked up so the stylesheet can set it in gold
  function amt() { return '<span class="amt">\u20B9' + inr0(minPrice()) + '</span>'; }
  // one room category, or several that all cost the same
  function flatRate() { return C.rooms.length === 1 || minPrice() === Math.max.apply(null, C.rooms.map(function (r) { return r.price; })); }
  function hasPhotos() { return C.photosReady === true; }
  function inr(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* wa.me link with a message already typed in. This is the
     single most-used button on a tier-3 lodge site. */
  function wa(msg) {
    return 'https://wa.me/' + C.whatsapp + (msg ? '?text=' + encodeURIComponent(msg) : '');
  }

  var HREFS = {
    tel:     function () { return 'tel:' + C.phone; },
    tel2:    function () { return 'tel:' + C.phone2; },
    mail:    function () { return 'mailto:' + C.email; },
    maps:    function () { return C.mapsLink; },
    review:  function () { return C.reviewLink; },
    waPlain: function () { return wa(''); },
    waBook:  function () {
      return wa('Hello ' + C.name + ', I would like to book a room. Please tell me the availability and tariff.');
    }
  };

  /* ---------- amenity icons (emoji keeps it zero-weight) ---------- */
  var ICONS = {
    'hot-water': '♨', 'clock': '⏰', 'breakfast': '☕', 'wifi': '📶',
    'parking': '🚗', 'power': '🔋', 'cctv': '📷', 'lift': '🛂',
    'luggage': '🧳', 'room-service': '🔔', 'laundry': '👕', 'doctor': '🩺'
  };

  /* =========================================================
     RENDER
     ========================================================= */
  function render() {
    document.documentElement.lang = lang;
    document.body.classList.toggle('te', lang === 'te');

    /* simple text bindings */
    var vals = {
      name: lang === 'te' ? C.nameTe : C.name,
      cityLine: t('cityLine'),
      heroEyebrow: t('heroEyebrow'),
      heroTitle: t('heroTitle'),
      tagline: t('tagline'),
      ctaWhatsApp: t('ctaWhatsApp'),
      ctaCall: t('ctaCall'),
      directNote: t('directNote'),
      phone1: C.phoneDisplay,
      phone2: C.phone2.replace(/^(\+91)(\d{5})(\d{5})$/, '$1 $2 $3'),
      email: C.email
    };
    ['h2Rooms','pRooms','h3LongStay','pLongStay','h2Amenities','pAmenities','h2Location','pLocation',
     'thPlace','thDist','thTime','ctaDirections','h2Offers','pOffers','h2Gallery','pGallery',
     'h2Reviews','pReviews','reviewAsk','ctaReview','h2Book','pBook','lblName','lblPhone','lblIn',
     'lblOut','lblRoom','lblQty','lblNote','ctaSend','bkHint','h3Reach','lblCall24','lblAlt',
     'lblEmail','h3Upi','pUpi','h3Policy','ftrReg','demoNote'
    ].forEach(function (k) { vals[k] = t(k); });

    $$('[data-bind]').forEach(function (el) {
      var v = vals[el.getAttribute('data-bind')];
      if (v != null) el.textContent = v;
    });
    // only for values this file builds as markup; never user input
    $$('[data-bind-html]').forEach(function (el) {
      var v = vals[el.getAttribute('data-bind-html')];
      if (v != null) el.innerHTML = v;
    });
    $$('[data-bind-href]').forEach(function (el) {
      var f = HREFS[el.getAttribute('data-bind-href')];
      if (f) el.setAttribute('href', f());
    });

    $('#langBtn').textContent = lang === 'en' ? 'తెలుగు' : 'English';
    document.title = (lang === 'te' ? C.nameTe : C.name) + ' — ' +
      (lang === 'te' ? 'కడపలో లాడ్జి' : 'Lodge in ' + C.address.city);
    $('.brand-mark').textContent = C.name.split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();

    var heroImg = $('.hero-bg img');
    if (heroImg) heroImg.hidden = !hasPhotos();

    renderHeroPills();
    renderTrust();
    renderRooms();
    renderLongStay();
    renderAmenities();
    renderDistances();
    renderOffers();
    renderGallery();
    renderReviews();
    renderAddresses();
    renderPolicies();
    renderBookingForm();
  }

  function renderHeroPills() {
    var picks = C.amenities.slice(0, 5);
    $('#heroPills').innerHTML = picks.map(function (a) {
      return '<li>' + (ICONS[a.icon] || '✓') + ' ' + esc(lang === 'te' ? a.te : a.label) + '</li>';
    }).join('');
  }

  function renderTrust() {
    var items = lang === 'te'
      ? [[C.totalRooms, 'గదులు'], [inr(minPrice()), 'నుండి / రాత్రి'], [C.ratingValue + ' ★', C.ratingCount + ' రివ్యూలు'], ['24', 'గంటల చెక్అవుట్']]
      : [[C.totalRooms, 'Rooms'], [inr(minPrice()), 'From / night'], [C.ratingValue + ' ★', C.ratingCount + ' reviews'], ['24 hr', 'Checkout']];
    $('#trustIn').innerHTML = items.map(function (i) {
      return '<div class="tr-item"><b>' + esc(i[0]) + '</b><span>' + esc(i[1]) + '</span></div>';
    }).join('');
  }

  function renderRooms() {
    $('#roomsGrid').className = 'rooms' + (C.rooms.length === 1 ? ' is-single' : '');
    $('#roomsGrid').innerHTML = C.rooms.map(function (r) {
      var msg = 'Hello ' + C.name + ', I want to book the ' + r.name + ' (' + inr(r.price) + ' per night). Is it available?';
      return '' +
      '<article class="room' + (r.popular ? ' is-popular' : '') + '">' +
        (r.popular ? '<span class="room-tag">' + (lang === 'te' ? 'ఎక్కువ బుకింగ్' : 'Most booked') + '</span>' : '') +
        (hasPhotos()
          ? '<div class="room-img"><img src="' + esc(r.img) + '" alt="' + esc(r.name) + '" loading="lazy" width="800" height="600"></div>'
          : '<div class="room-img photo-pending"><span class="pp-ic" aria-hidden="true">\uD83D\uDCF7</span>' +
            '<strong>' + esc(t('photoSoon')) + '</strong>' +
            '<span class="pp-sub">' + esc(t('photoSoonSub')) + '</span></div>') +
        '<div class="room-bd">' +
          '<h3 class="room-nm">' + esc(lang === 'te' && r.nameTe ? r.nameTe : r.name) + '</h3>' +
          '<div class="room-meta"><span>👤 ' + esc(r.occupancy) + '</span><span>🛏 ' + esc(r.beds) + '</span></div>' +
          '<ul class="room-ft">' + r.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' +
          (r.note ? '<p class="room-note">' + esc(r.note) + '</p>' : '') +
          '<div class="room-ftr">' +
            '<div class="room-pr"><b>' + inr(r.price) + '</b><span>' + esc(t('night')) + '</span></div>' +
            '<a class="btn btn-wa" href="' + esc(wa(msg)) + '">' + esc(lang === 'te' ? 'బుక్ చేయండి' : 'Book this') + '</a>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  function renderLongStay() {
    var box = document.getElementById('longstay');
    if (box) box.hidden = !C.longStay.length;
    if (!C.longStay.length) { $('#lsGrid').innerHTML = ''; return; }
    $('#lsGrid').innerHTML = C.longStay.map(function (l) {
      return '<div class="ls"><b>' + inr(l.price) + '</b><strong>' + esc(l.label) + '</strong><span>' + esc(l.for) + '</span></div>';
    }).join('');
  }

  function renderAmenities() {
    $('#amenGrid').innerHTML = C.amenities.map(function (a) {
      return '<li><span class="ic" aria-hidden="true">' + (ICONS[a.icon] || '✓') + '</span>' +
             esc(lang === 'te' ? a.te : a.label) + '</li>';
    }).join('');
  }

  function renderDistances() {
    $('#distBody').innerHTML = C.distances.map(function (d) {
      var approx = d.verified === false ? '~' : '';
      var km = approx + (d.km < 1 ? (d.km * 1000) + ' m' : d.km + ' km');
      var mins = approx + (d.mins >= 60 ? Math.round(d.mins / 60 * 10) / 10 + (lang === 'te' ? ' గం' : ' hr') : d.mins + (lang === 'te' ? ' ని' : ' min'));
      return '<tr><td>' + esc(lang === 'te' && d.placeTe ? d.placeTe : d.place) + '</td><td>' + esc(km) + '</td><td>' + esc(mins) + '</td></tr>';
    }).join('');
    // the map frame is optional: some embeds of this page omit it
    var mapFrame = $('#mapFrame');
    if (mapFrame) mapFrame.src = C.mapsEmbed;
  }

  function renderOffers() {
    $('#offersGrid').innerHTML = C.offers.map(function (o) {
      var msg = 'Hello ' + C.name + ', I am asking about: ' + o.title + '. Please share the rate and availability.';
      return '<article class="offer">' +
        '<h3>' + esc(lang === 'te' && o.titleTe ? o.titleTe : o.title) + '</h3>' +
        '<p>' + esc(o.body) + '</p>' +
        '<a class="btn btn-ghost" href="' + esc(wa(msg)) + '">' + esc(o.cta) + '</a>' +
      '</article>';
    }).join('');
  }

  function renderGallery() {
    // No gallery of placeholder boxes. Until real photographs exist the
    // whole section is removed, which reads as deliberate rather than broken.
    var sec = document.getElementById('gallery');
    if (sec) sec.hidden = !hasPhotos() || !C.gallery.length;
    if (!hasPhotos()) { $('#galGrid').innerHTML = ''; return; }
    $('#galGrid').innerHTML = C.gallery.map(function (g) {
      return '<figure><img src="' + esc(g.img) + '" alt="' + esc(g.caption) + '" loading="lazy" width="800" height="600">' +
             '<figcaption>' + esc(g.caption) + '</figcaption></figure>';
    }).join('');
  }

  function renderReviews() {
    $('#revGrid').innerHTML = C.reviews.map(function (r) {
      return '<article class="rev">' +
        '<div class="rev-st" aria-label="' + r.stars + ' out of 5">' + '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars) + '</div>' +
        '<p class="rev-tx">' + esc(r.text) + '</p>' +
        '<p class="rev-by">' + esc(r.name) + ' <span>· ' + esc(r.source) + '</span></p>' +
      '</article>';
    }).join('');
  }

  function renderAddresses() {
    var a = C.address;
    var html = esc(a.line1) + '<br>' + esc(a.line2) + '<br>' +
               esc(a.city) + ', ' + esc(a.state) + ' ' + esc(a.pincode);
    $('#addrBlock').innerHTML = html;
    $('#ftrAddr').innerHTML = html + '<br>' + esc(C.phoneDisplay);
    $('#upiId').textContent = C.upi.id;
  }

  function renderPolicies() {
    $('#policyList').innerHTML = C.policies.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
  }

  /* =========================================================
     BOOKING FORM -> WhatsApp
     ========================================================= */
  function renderBookingForm() {
    var sel = $('#bkRoom');
    sel.innerHTML = C.rooms.map(function (r) {
      return '<option value="' + esc(r.id) + '">' + esc(lang === 'te' && r.nameTe ? r.nameTe : r.name) + ' — ' + inr(r.price) + '</option>';
    }).join('');
    var qty = $('#bkQty');
    if (!qty.options.length) {
      qty.innerHTML = [1, 2, 3, 4, 5, 6].map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
    }
    var today = new Date().toISOString().slice(0, 10);
    $('#bkIn').min = today;
    $('#bkOut').min = today;
  }

  function nights() {
    var i = $('#bkIn').value, o = $('#bkOut').value;
    if (!i || !o) return 1;
    var d = (new Date(o) - new Date(i)) / 86400000;
    return d > 0 ? Math.round(d) : 1;
  }

  function updateEstimate() {
    var room = C.rooms.filter(function (r) { return r.id === $('#bkRoom').value; })[0];
    var est = $('#est');
    if (!room) { est.classList.remove('on'); return; }
    var n = nights(), q = Number($('#bkQty').value) || 1, total = room.price * n * q;
    est.innerHTML = esc(t('estFor')) + ': <b>' + inr(total) + '</b><br>' +
      '<span style="font-weight:500">' + q + ' ' + esc(q > 1 ? t('estRoomsP') : t('estRooms')) +
      ' × ' + n + ' ' + esc(n > 1 ? t('estNightsP') : t('estNights')) +
      ' × ' + inr(room.price) + '<br>' + esc(t('estOnArrival')) + '</span>';
    est.classList.add('on');
  }

  function onSubmit(e) {
    e.preventDefault();
    var f = e.target;
    if (!f.name.value.trim() || !f.phone.value.trim()) {
      f.reportValidity && f.reportValidity();
      return;
    }
    var room = C.rooms.filter(function (r) { return r.id === f.room.value; })[0];
    var n = nights(), q = Number(f.qty.value) || 1;

    var lines = [
      'Booking enquiry — ' + C.name,
      '',
      'Name: ' + f.name.value.trim(),
      'Mobile: ' + f.phone.value.trim(),
      'Check-in: ' + (f.checkin.value || 'not decided'),
      'Check-out: ' + (f.checkout.value || 'not decided'),
      'Room: ' + (room ? room.name : '-') + ' × ' + q,
      'Nights: ' + n
    ];
    if (room) lines.push('Approx total: ' + inr(room.price * n * q));
    if (f.note.value.trim()) lines.push('', 'Note: ' + f.note.value.trim());
    lines.push('', 'Please confirm availability.');

    window.open(wa(lines.join('\n')), '_blank', 'noopener');
  }

  /* =========================================================
     STRUCTURED DATA for Google
     This is what makes the price, rating, phone number and map
     pin show up in search results. Worth more than the design.
     ========================================================= */
  function injectSchema() {
    var d = {
      '@context': 'https://schema.org',
      '@type': 'Hotel',
      name: C.name,
      description: C.tagline,
      url: location.href.split('#')[0],
      telephone: C.phone,
      email: C.email,
      priceRange: inr(minPrice()) + ' – ' + inr(Math.max.apply(null, C.rooms.map(function (r) { return r.price; }))),
      currenciesAccepted: 'INR',
      paymentAccepted: 'Cash, UPI, Card',
      numberOfRooms: C.totalRooms,
      checkinTime: '12:00',
      checkoutTime: '12:00',
      address: {
        '@type': 'PostalAddress',
        streetAddress: C.address.line1 + ', ' + C.address.line2,
        addressLocality: C.address.city,
        addressRegion: C.address.state,
        postalCode: C.address.pincode,
        addressCountry: C.address.country
      },
      hasMap: C.mapsLink,
      openingHoursSpecification: {
        '@type': 'OpeningHoursSpecification',
        dayOfWeek: ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],
        opens: '00:00', closes: '23:59'
      },
      amenityFeature: C.amenities.map(function (a) {
        return { '@type': 'LocationFeatureSpecification', name: a.label, value: true };
      }),
      aggregateRating: {
        '@type': 'AggregateRating',
        ratingValue: C.ratingValue, reviewCount: C.ratingCount, bestRating: 5, worstRating: 1
      },
      makesOffer: C.rooms.map(function (r) {
        return {
          '@type': 'Offer',
          name: r.name,
          price: r.price,
          priceCurrency: 'INR',
          availability: 'https://schema.org/InStock',
          eligibleQuantity: { '@type': 'QuantitativeValue', unitText: 'night', value: 1 }
        };
      })
    };
    // Only publish coordinates once someone has actually stood at the
    // gate and read them off the phone. See config.js -> geo.verified.
    if (C.geo && C.geo.verified) {
      d.geo = { '@type': 'GeoCoordinates', latitude: C.geo.lat, longitude: C.geo.lng };
    }

    var s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(d);
    document.head.appendChild(s);
  }

  /* =========================================================
     BOOT
     ========================================================= */
  function init() {
    // remember the visitor's language choice
    try {
      var saved = localStorage.getItem('lodge.lang');
      if (saved === 'te' || saved === 'en') lang = saved;
    } catch (_) { /* private mode: fall back to English */ }

    render();
    injectSchema();

    $('#langBtn').addEventListener('click', function () {
      lang = lang === 'en' ? 'te' : 'en';
      try { localStorage.setItem('lodge.lang', lang); } catch (_) {}
      render();
      updateEstimate();
    });

    $('#bookForm').addEventListener('submit', onSubmit);
    ['#bkRoom', '#bkQty', '#bkIn', '#bkOut'].forEach(function (s) {
      $(s).addEventListener('change', function () {
        // keep checkout on or after check-in
        var i = $('#bkIn').value;
        if (i) $('#bkOut').min = i;
        updateEstimate();
      });
    });

    // smooth in-page nav without the hash jumping under the header
    $$('a[href^="#"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var el = document.querySelector(a.getAttribute('href'));
        if (el) { e.preventDefault(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
